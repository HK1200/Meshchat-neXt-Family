name: CallConsentChecks
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  CallConsentHost:
    type: application
    platform: iOS
    sources: [Host.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.next.call-consent-test-host
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      TARGETED_DEVICE_FAMILY: "1,2"
  CallConsentChecks:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../NextRuntimeProbe/App/NextCallWakeContext.swift
      - path: ../NextRuntimeProbe/App/NextCallWakeEnrollment.swift
      - path: ../NextRuntimeProbe/App/NextCallWakeInstallation.swift
      - path: ../NextRuntimeProbe/App/NextCallWakeIdentity.swift
      - path: ../NextRuntimeProbe/App/NextCallWakeRegistration.swift
      - path: ../NextRuntimeProbe/App/NextCallWakePolicy.swift
      - path: ../NextRuntimeProbe/App/NextVoIPPushDevice.swift
      - path: ../NextRuntimeProbe/App/NextPushServices.swift
      - path: ../FamilyLive/FamilyCallWake.swift
      - path: ../NextRuntimeProbe/Tests/CallWakeEnrollmentTests.swift
      - path: ../NextRuntimeProbe/Tests/CallWakeInstallationTests.swift
      - path: ../NextRuntimeProbe/Tests/CallWakeIdentityTests.swift
      - path: ../NextRuntimeProbe/Tests/CallWakeRegistrationTests.swift
      - path: ../NextRuntimeProbe/Tests/CallWakePolicyTests.swift
      - path: ../NextRuntimeProbe/Tests/CallWakeTests.swift
      - path: ../NextRuntimeProbe/Tests/VoIPPushDeviceTests.swift
      - path: ../NextRuntimeProbe/Tests/call-wake-fixture.json
        buildPhase: resources
    dependencies:
      - target: CallConsentHost
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.next.call-consent-checks
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CallConsentHost.app/CallConsentHost"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CallConsentChecks:
    build:
      targets:
        CallConsentHost: all
        CallConsentChecks: [test]
    test:
      targets: [CallConsentChecks]
