name: NextDeviceChecks
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  DeviceCheckHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: HostInfo.plist
      properties:
        CFBundleDisplayName: neXt Device Checks
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.next.ios.devicechecks.host
      TARGETED_DEVICE_FAMILY: '1,2'
  NextDeviceChecks:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DeviceCheckHost
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.next.ios.devicechecks.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: DeviceCheckHost
      TARGETED_DEVICE_FAMILY: '1,2'
schemes:
  NextDeviceChecks:
    build:
      targets:
        DeviceCheckHost: all
    test:
      targets: [NextDeviceChecks]
