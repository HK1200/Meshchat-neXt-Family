name: NextRuntimeProbe
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  NextRuntimeProbe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [next-web-preferences.js]
      - path: App/next-web-preferences.js
        buildPhase: resources
      - path: SIP-NOTICES.txt
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: staged
        type: folder
        buildPhase: resources
    info:
      path: ProbeInfo.plist
      properties:
        CFBundleDisplayName: Meshchat neXt
        CFBundleShortVersionString: "0.1.27"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NextPushEnvironment: "$(NEXT_APNS_ENVIRONMENT)"
        NSPhotoLibraryUsageDescription: Choose photos to attach to a message.
        NSPhotoLibraryAddUsageDescription: Save a received photo when you choose Save Image.
        NSCameraUsageDescription: Scan a contact QR code or take a photo to attach when you choose the camera.
        NSLocationWhenInUseUsageDescription: Use your location when you choose to center the map or share it with a contact.
        NSMicrophoneUsageDescription: Record a voice message or speak during a call when you choose.
        UIBackgroundModes: [bluetooth-central, audio, voip, location]
        NSBluetoothAlwaysUsageDescription: Connect to the RNode or MeshCore companion you choose for mesh messaging.
        NSLocalNetworkUsageDescription: Connect to the local Reticulum peers, radios or SIP providers you choose.
        NSAppTransportSecurity:
          NSExceptionDomains:
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: true
    settings:
      CURRENT_PROJECT_VERSION: "1"
      NEXT_APNS_ENVIRONMENT: ""
      PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.next.ios.runtimeprobe
      "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": AppSimulator.entitlements
      SWIFT_OBJC_BRIDGING_HEADER: App/ProbeRuntime.h
      HEADER_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers $(PROJECT_DIR)/SIPBuild/re-4.12.0/include $(PROJECT_DIR)/SIPBuild/baresip-4.12.0/include"
      LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/SIPBuild/$(PLATFORM_NAME)-$(CURRENT_ARCH)"
      OTHER_LDFLAGS: "$(inherited) -lFamilySIP -lresolv -lz -framework AudioToolbox -framework CoreAudio -framework Security -framework SystemConfiguration"
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    putResourcesBeforeSourcesBuildPhase: true
    postCompileScripts:
      - name: Package Python standard library
        script: |
          set -e
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          python3 "$PROJECT_DIR/VoiceBuild/install-room-wheels.py" "$PLATFORM_NAME" "$ARCHS" "$CODESIGNING_FOLDER_PATH/staged"
          bash "$PROJECT_DIR/VoiceBuild/build-voice-codecs.sh" --slice "$PLATFORM_NAME" "$ARCHS"
          python3 "$PROJECT_DIR/VoiceBuild/install-voice-runtime.py" "$PLATFORM_NAME" "$ARCHS" "$CODESIGNING_FOLDER_PATH" "$EXPANDED_CODE_SIGN_IDENTITY"
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          install_python Python.xcframework staged
  NextRuntimeProbeUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [peer.json, ProbeUITests.swift]
      - path: App/NextNativeModelHost.swift
      - path: App/NextLocationGrants.swift
      - path: App/NextLocationCommand.swift
      - path: App/FamilyLocationSession.swift
      - path: App/NextFamilyCard.swift
      - path: App/AttachmentExport.swift
      - path: App/MessageAlerts.swift
      - path: App/NextMeshCoreAlertTarget.swift
      - path: App/NextMeshCoreSecrets.swift
      - path: App/NextSIPPasswords.swift
      - path: App/NextCredentials.swift
      - path: App/NextWebPreferences.swift
      - path: App/NextWebPreferencesBridge.swift
      - path: App/NextExternalLinks.swift
      - path: App/NextNomadFramePolicy.swift
      - path: App/NextModalPage.swift
      - path: App/NextWebLoadState.swift
      - path: App/NextRuntimeStartup.swift
      - path: App/NextHTTP.swift
      - path: App/NextSIPNetwork.swift
      - path: App/NextSIPNativeDriver.swift
      - path: App/NextMailboxAddress.swift
      - path: App/NextPushServices.swift
      - path: App/NextPushRegistration.swift
      - path: App/NextSIPAccountDraft.swift
      - path: App/NextSIPRegistration.swift
      - path: App/NextSIPCallSession.swift
      - path: App/NextReticulumWakeRouter.swift
      - path: App/NextCallWakeDispatcher.swift
      - path: App/NextCallWakeContext.swift
      - path: App/NextVoIPPushDevice.swift
      - path: App/NextCallWakeIdentity.swift
      - path: App/NextCallWakeEnrollment.swift
      - path: App/NextCallWakeInstallation.swift
      - path: App/NextCallWakeRegistration.swift
      - path: App/NextCallWakePolicy.swift
      - path: App/NextCallWakeCancellation.swift
      - path: App/FamilyCallWake.swift
      - path: App/FamilySystemCalls.swift
      - path: App/FamilyCallKitDriver.swift
      - path: App/FamilyCallAudioSession.swift
      - path: App/FamilySIPPolicy.swift
      - path: App/NextRNodeProfile.swift
      - path: App/FamilyRadioWake.swift
    dependencies:
      - target: NextRuntimeProbe
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.next.ios.runtimeprobe.unit-tests
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_OBJC_BRIDGING_HEADER: App/ProbeRuntime.h
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NextRuntimeProbe.app/NextRuntimeProbe"
      BUNDLE_LOADER: "$(TEST_HOST)"
  NextRuntimeProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ProbeUITests.swift
      - path: Tests/peer.json
        buildPhase: resources
    dependencies:
      - target: NextRuntimeProbe
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.next.ios.runtimeprobe.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: NextRuntimeProbe
schemes:
  NextRuntimeProbe:
    build:
      targets:
        NextRuntimeProbe: all
    test:
      targets: [NextRuntimeProbeUnitTests, NextRuntimeProbeUITests]
