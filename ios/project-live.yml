include:
  - project.yml
name: FamilyLive
targets:
  FamilyLive:
    type: application
    platform: iOS
    info:
      path: RuntimeBuild/FamilyLive-Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - org.meshchat.family.ios.live.mailbox
        UIBackgroundModes:
          - fetch
    sources:
      - FamilyLive
      - LiveRuntime
      - path: RuntimeBuild/staged
        type: folder
        buildPhase: resources
    dependencies:
      - framework: RuntimeBuild/Python.xcframework
        embed: true
        codeSign: true
    putResourcesBeforeSourcesBuildPhase: true
    postCompileScripts:
      - name: Package Python standard library
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -e
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          python3 "$PROJECT_DIR/install-room-wheels.py" "$PLATFORM_NAME" "$ARCHS" "$CODESIGNING_FOLDER_PATH/staged"
          source "$PROJECT_DIR/RuntimeBuild/Python.xcframework/build/utils.sh"
          install_python RuntimeBuild/Python.xcframework staged
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.family.ios.live
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: neXt Family TCP
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan contact QR codes in Guardian settings."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Share your location with the contacts your guardian approved while Family is open."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to Reticulum peers on your local network."
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: LiveRuntime/FamilyRuntime.h
        HEADER_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  FamilyLiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FamilyLiveUITests
      - path: RuntimeBuild/test-peer.json
        optional: true
        buildPhase: resources
    dependencies:
      - target: FamilyLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.meshchat.family.ios.live.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FamilyLive
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
schemes:
  FamilyLive:
    build:
      targets:
        FamilyLive: all
    test:
      targets:
        - FamilyLiveUITests
