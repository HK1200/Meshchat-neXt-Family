name: Build isolated iPad device checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Compile the separate read-only device check
        run: bash ios/DeviceChecks/build.sh
      - name: Keep the unsigned test runner only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-device-checks-unsigned
          path: |
            ios/DeviceChecks/neXt-Device-Checks-unsigned.ipa
            ios/DeviceChecks/neXt-Device-Checks-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
