name: Published Family updater verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Verify current and legacy updater feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/family_release_feeds.py
