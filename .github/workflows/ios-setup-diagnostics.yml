name: Inspect isolated Family setup status
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Inspect the known synthetic test without exporting recordings
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$RESULT_REPO/actions/runs/44907831071" > run.json
          python3 - <<'PY'
          import json
          run = json.load(open('run.json'))
          assert run['head_sha'] == '36bd820d5de9399686444ab2a33850ac6754381c'
          assert run['event'] == 'workflow_dispatch'
          assert run['path'] == '.github/workflows/ios-preview.yml'
          assert run['head_repository']['full_name'] == 'HK1200/Meshchat-neXt-Family'
          PY
          gh run download 44907831071 --repo "$RESULT_REPO" --name ios-results-iPhone-live-1 --dir original
          # Raw images/video stay on this disposable runner. No artifact is uploaded.
          # Only a fixed list of boolean setup-error flags may enter the job log.
          cat > inspect.swift <<'SWIFT'
          import Foundation
          import Vision
          import AVFoundation
          let phrases = ["password_mismatch": "passwords do not match",
                         "password_too_short": "at least",
                         "setup_visible": "guardian setup",
                         "setup_button_visible": "create guardian access",
                         "contact_setup_visible": "add approved contact",
                         "unlock_visible": "unlock",
                         "backend_disconnected": "disconnected from backend"]
          var flags = Dictionary(uniqueKeysWithValues: phrases.keys.map { ($0, false) })
          var inspected = 0
          func inspect(_ handler: VNImageRequestHandler) throws {
              let request = VNRecognizeTextRequest()
              request.recognitionLevel = .accurate
              try handler.perform([request])
              let text = (request.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: " ").lowercased()
              for (key, phrase) in phrases where text.contains(phrase) { flags[key] = true }
              inspected += 1
          }
          let root = URL(fileURLWithPath: CommandLine.arguments[1])
          for case let file as URL in FileManager.default.enumerator(at: root, includingPropertiesForKeys: nil)! {
              if ["png", "jpg", "jpeg"].contains(file.pathExtension.lowercased()) {
                  try inspect(VNImageRequestHandler(url: file))
              } else if file.pathExtension.lowercased() == "mp4" {
                  let asset = AVURLAsset(url: file)
                  let generator = AVAssetImageGenerator(asset: asset)
                  generator.appliesPreferredTrackTransform = true
                  let duration = CMTimeGetSeconds(asset.duration)
                  if duration.isFinite && duration > 0 {
                      let image = try generator.copyCGImage(at: CMTime(seconds: max(0, duration - 0.5), preferredTimescale: 600), actualTime: nil)
                      try inspect(VNImageRequestHandler(cgImage: image))
                  }
              }
          }
          guard inspected > 0 else { exit(2) }
          let data = try JSONSerialization.data(withJSONObject: ["flags": flags, "images_inspected": inspected], options: [.sortedKeys])
          print(String(decoding: data, as: UTF8.self))
          SWIFT
          count=0
          while IFS= read -r -d '' bundle; do
            count=$((count + 1))
            xcrun xcresulttool export attachments --path "$bundle" --output-path "local-evidence-$count" \
              --test-id 'FamilyAutomaticCallUITests/testAutomaticChooserForApprovedSIPContactDoesNotCallAnUnavailableService()' > /dev/null
            swift inspect.swift "local-evidence-$count"
          done < <(find original -type d -name '*.xcresult' -print0)
          test "$count" -gt 0
          rm -rf original local-evidence-*
