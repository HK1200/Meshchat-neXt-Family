name: Family iOS simulator

on:
  workflow_dispatch:
    inputs:
      rmap:
        description: Run live messaging through rmap.world on both simulators
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'ios/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/python/**'
      - '.github/workflows/ios-preview.yml'

permissions:
  contents: read

jobs:
  simulator:
    name: ${{ matrix.device }} ${{ matrix.suite }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        suite: [live, preview]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Run live Reticulum messaging test
        if: matrix.suite == 'live'
        run: bash ios/test-live.sh "${{ matrix.device }}"
      - name: Run public Reticulum messaging test
        if: matrix.suite == 'live' && (inputs.rmap || contains(github.event.pull_request.labels.*.name, 'ios-rmap-test'))
        run: bash ios/test-live.sh "${{ matrix.device }}" rmap
      - name: Run preview smoke test
        if: matrix.suite == 'preview'
        run: bash ios/test-preview.sh "${{ matrix.device }}"
