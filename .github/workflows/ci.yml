name: Family CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Android backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify bundled Android build inputs
        run: sha256sum --check gradle/android-binaries.sha256
      - name: Install host voice codec libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0 libopusfile0 libogg0 libcodec2-1.2
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r tests/requirements.lock
      - name: Test Family backend
        run: python -m pytest -q tests
