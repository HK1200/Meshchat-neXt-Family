name: Family CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Android backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify bundled Android build inputs
        run: sha256sum --check gradle/android-binaries.sha256
      - name: Install host voice codec libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0 libopusfile0 libogg0 libcodec2-1.2
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r tests/requirements.lock
      - name: Test Family backend
        run: python -m pytest -q tests ios/push-provider/test_provider.py

  next-voice-media:
    name: neXt iOS encrypted voice media
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies and host codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0 libopusfile0 libogg0 libcodec2-1.2
          python -m pip install --require-hashes -r tests/requirements.lock
      - name: Stage the checksum-verified neXt backend
        run: |
          mkdir -p temp-tests/voice-source
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/HK1200/Meshchat-neXt/releases/download/v0.1.21/meshchat_next-0.1.21-py3-none-any.whl \
            --output temp-tests/voice-source/backend.whl
          python -c 'import json, subprocess; s=json.load(open("ios/cbor-runtime.json")); subprocess.run(["curl", "--fail", "--silent", "--show-error", "--location", "--retry", "3", "--max-time", "120", "--max-filesize", "2097152", s["url"], "--output", "temp-tests/voice-source/cbor2.whl"], check=True)'
          python ios/NextRuntimeProbe/stage-backend.py \
            temp-tests/voice-source/backend.whl temp-tests/voice-source/staged ios --voice-only \
            --cbor-wheel temp-tests/voice-source/cbor2.whl
      - name: Verify mobile decoder depth and independent-message isolation
        run: |
          python ios/test-cbor-security.py --staged temp-tests/voice-source/staged \
            --report temp-tests/cbor-security-proof.json
      - name: Verify private offline maps, imports and restart preservation
        run: |
          python ios/NextRuntimeProbe/test-maps-runtime.py \
            --backend-source temp-tests/voice-source/staged --work-dir temp-tests/maps-network
      - name: Verify Relay Chat against the unmodified desktop hub
        run: |
          python ios/NextRuntimeProbe/test-relay-runtime.py \
            --backend-source temp-tests/voice-source/staged --reference-wheel temp-tests/voice-source/backend.whl \
            --work-dir temp-tests/relay-network
      - name: Verify signed location exchange and silent inbox behavior
        run: |
          python ios/NextRuntimeProbe/test-telemetry-runtime.py \
            --backend-source temp-tests/voice-source/staged --work-dir temp-tests/telemetry-network
      - name: Confirm silence cannot pass the media proof
        run: |
          if python ios/NextRuntimeProbe/test-voice-loopback.py \
            --backend-source temp-tests/voice-source/staged --work-dir temp-tests/voice-silence \
            --silent-negative-control > temp-tests/voice-silence.log 2>&1; then
            cat temp-tests/voice-silence.log
            echo "Silent media unexpectedly passed"
            exit 1
          fi
          python -c "from pathlib import Path; assert 'Silent/comfort-only audio cannot pass settled-tone proof' in Path('temp-tests/voice-silence.log').read_text()"
      - name: Verify private calls, both audio directions and live quality switching
        run: |
          python ios/NextRuntimeProbe/test-voice-loopback.py \
            --backend-source temp-tests/voice-source/staged --work-dir temp-tests/voice-network
      - name: Keep synthetic voice proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-ios-encrypted-voice-proof
          path: |
            temp-tests/voice-network/proof.json
            temp-tests/maps-network/proof.json
            temp-tests/relay-network/proof.json
            temp-tests/cbor-security-proof.json
            temp-tests/telemetry-network/proof.json
          if-no-files-found: error
          retention-days: 14
